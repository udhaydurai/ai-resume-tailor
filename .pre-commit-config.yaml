repos:
  - repo: local
    hooks:
      - id: scan-repo
        name: scan for personal data and private files
        entry: uv run python scripts/scan_repo.py
        language: system
        pass_filenames: true
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
