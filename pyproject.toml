[project]
name = "ai-resume-tailor"
version = "0.2.0"
description = "Tailor your resume and cover letter for any job, powered by Claude."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "beautifulsoup4>=4.12",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "reportlab>=4.1",
    "requests>=2.32",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pre-commit>=4.7.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-requests>=2.32",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]
"app.py" = ["E501"]
"src/ai_engine.py" = ["E501"]  # prompt text reads better unwrapped

[tool.mypy]
strict = true
files = ["src", "scripts", "evals"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov=scripts --cov-report=term-missing --cov-fail-under=85"
